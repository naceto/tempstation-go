openapi: "3.0.0"
info:
  version: 1.0.0
  title: Tempstation API
tags:
  - name: sensors
    description: Sensor endpoints

paths:
  /v1/sensors:
    get:
      tags:
        - sensors
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
            format: int32
          description: The number of items to skip before starting to collect the result set
        - in: query
          name: limit
          schema:
            type: integer
            format: int32
          description: The numbers of items to return
        - in: query
          name: mac
          schema:
            type: string
            pattern: "^([[:xdigit:]]{2}(:[[:xdigit:]]{2}){5}|[[:xdigit:]]{2}(-[[:xdigit:]]{2}){5})$"
      responses:
        "200":
          $ref: "#/components/responses/SensorsResponse"
        "400":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"
        "500":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"
    post:
      tags:
        - sensors
      requestBody:
        $ref: "#/components/requestBodies/SensorPost"
      responses:
        "200":
          $ref: "#/components/responses/SensorResponse"
        "400":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"
        "500":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"
  /v1/sensors/{id}:
    get:
      tags:
        - sensors
      summary: Get a sensor by ID.
      parameters:
        - name: id
          in: path
          description: Sensor ID
          required: true
          schema:
            $ref: "../common/openapi.yaml#/components/schemas/ID"
      responses:
        "200":
          $ref: "#/components/responses/SensorResponse"
        "400":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"
        "500":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"
  /v1/sensors/{id}/data:
    get:
      tags:
        - sensors
      summary: Get sensor data.
      parameters:
        - name: id
          in: path
          description: Sensor ID
          required: true
          schema:
            $ref: "../common/openapi.yaml#/components/schemas/ID"
        - name: start
          in: query
          description: A start datetime for the returned data.
          required: true
          schema:
            type: string
            format: date-time
        - name: end
          in: query
          description: A optional end datetime for the returned data.
          required: false
          schema:
            type: string
            format: date-time
      responses:
        "200":
          $ref: "#/components/responses/SensorsDataResponse"
        "400":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"
        "500":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"
    post:
      tags:
        - sensors
      summary: Post sensor data.
      parameters:
        - name: id
          in: path
          description: Sensor ID
          required: true
          schema:
            $ref: "../common/openapi.yaml#/components/schemas/ID"
      requestBody:
        $ref: "#/components/requestBodies/SensorDataPost"
      responses:
        "200":
          $ref: "#/components/responses/SensorDataResponse"
        "400":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"
        "500":
          $ref: "../common/openapi.yaml#/components/responses/ErrorResponse"

components:
  requestBodies:
    SensorPost:
      description: The new sensor to add.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SensorPost"

    SensorDataPost:
      description: The new sensor data to add.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SensorDataPost"

  responses:
    SensorsResponse:
      description: List of sensors.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SensorsResponse"

    SensorResponse:
      description: Sensor info.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Sensor"

    SensorsDataResponse:
      description: Sensors data response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SensorsDataResponse"

    SensorDataResponse:
      description: Sensor data response.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SensorData"

  schemas:
    Error:
      $ref: "../common/openapi.yaml#/components/schemas/Error"

    Sensor:
      type: object
      description: Sensor specific information.
      required:
        - id
        - userId
        - name
        - mac
        - type
      properties:
        id:
          $ref: "../common/openapi.yaml#/components/schemas/ID"
        userId:
          $ref: "../common/openapi.yaml#/components/schemas/ID"
        name:
          type: string
        mac:
          type: string
        type:
          $ref: "#/components/schemas/SensorType"

    SensorPost:
      type: object
      description: Sensor specific information.
      required:
        - userId
        - name
        - mac
        - type
      properties:
        userId:
          $ref: "../common/openapi.yaml#/components/schemas/ID"
        name:
          type: string
        mac:
          type: string
          pattern: "^([[:xdigit:]]{2}(:[[:xdigit:]]{2}){5}|[[:xdigit:]]{2}(-[[:xdigit:]]{2}){5})$"
        type:
          $ref: "#/components/schemas/SensorType"

    SensorsResponse:
      type: object
      description: List of sensors.
      required:
        - sensors
      properties:
        sensors:
          type: array
          items:
            $ref: "#/components/schemas/Sensor"

    SensorType:
      description: Sensor type.
      type: string
      enum:
        - DHT11
        - DHT22

    SensorsDataResponse:
      type: object
      description: List of sensor data.
      required:
        - data
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/SensorData"

    SensorData:
      type: object
      description: Sensor climate data.
      required:
        - id
        - sensorId
        - temperature
        - humidity
        - readingTime
      properties:
        id:
          type: integer
          format: int64
        sensorId:
          type: integer
          format: int64
        temperature:
          type: number
          format: float
        humidity:
          type: number
          format: float
        readingTime:
          type: string

    SensorDataPost:
      type: object
      description: Sensor post climate data.
      required:
        - sensorId
        - temperature
        - humidity
      properties:
        sensorId:
          type: integer
          format: int64
        temperature:
          type: number
          format: float
        humidity:
          type: number
          format: float
