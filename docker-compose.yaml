services:
  tempstation:
    build: .
    env_file:
      - .env
    depends_on:
      - postgres

  postgres:
    image: postgres
    restart: unless-stopped
    ports:
      - 5432:5432
    volumes:
      - ~/apps/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=${POSTGRES_USERNAME} 
      - POSTGRES_DB=${POSTGRES_DATABASE_NAME}
